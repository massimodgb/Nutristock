<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="NutriStock" />
  <title>NutriStock</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app"><div class="loading">Cargando…</div></div>
  <script>
    // Red de seguridad: si la app no arranca, en vez de quedarse en "Cargando…" enseña el error
    // y un botón para reintentar (borra la copia guardada sin conexión, NO tus datos).
    window.__errores = [];
    addEventListener('error', e => window.__errores.push(e.message || String(e)));
    addEventListener('unhandledrejection', e => window.__errores.push(String(e.reason && e.reason.message || e.reason)));
    setTimeout(function () {
      var app = document.getElementById('app');
      if (!app || window.__arrancada) return;
      app.innerHTML = '<div style="padding:32px 20px;font:16px -apple-system,sans-serif;text-align:center">' +
        '<p><b>La app no ha podido arrancar.</b></p>' +
        '<p style="color:#888;font-size:13px">' + (window.__errores.join('<br>') || 'Sin conexión o carga lenta.') + '</p>' +
        '<button id="reintentar" style="margin-top:12px;padding:12px 20px;border:0;border-radius:12px;background:#16a34a;color:#fff;font-size:16px">Reintentar</button>' +
        '<p style="color:#888;font-size:12px;margin-top:16px">Tus datos no se borran. Si sigue igual, haz una captura y pásasela a Claude.</p></div>';
      document.getElementById('reintentar').onclick = async function () {
        try {
          var regs = await navigator.serviceWorker.getRegistrations();
          for (var r of regs) await r.unregister();
          var ks = await caches.keys();
          for (var k of ks) await caches.delete(k);
        } catch (e) {}
        location.reload();
      };
    }, 8000);
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
