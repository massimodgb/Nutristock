<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NutriStock · comprobación antes de publicar</title>
  <style>
    body { font: 15px -apple-system, Segoe UI, sans-serif; margin: 24px; background: #111; color: #eee; }
    h1 { font-size: 20px; }
    li { margin: 3px 0; }
    .ok { color: #4ade80; } .mal { color: #f87171; font-weight: 600; }
    #resumen { font-size: 18px; margin: 12px 0; padding: 10px; border-radius: 8px; background: #222; }
  </style>
</head>
<body>
  <h1>Comprobación de NutriStock (antes de publicar)</h1>
  <p>Uso: <code>py herramientas/servidor.py</code> y abrir <code>http://127.0.0.1:5180/herramientas/comprobar.html</code>.
    Tiene que salir TODO en verde. Sirve igual para Claude y para Codex.</p>
  <div id="resumen">Comprobando…</div>
  <ul id="lista"></ul>
  <script type="module">
    const lista = document.getElementById('lista');
    let fallos = 0, total = 0;
    const apunta = (ok, texto) => {
      total++; if (!ok) fallos++;
      const li = document.createElement('li');
      li.className = ok ? 'ok' : 'mal';
      li.textContent = (ok ? '✓ ' : '✗ ') + texto;
      lista.appendChild(li);
    };
    const prueba = async (texto, fn) => {
      try { const r = await fn(); apunta(r === true, texto + (r === true ? '' : ` → ${JSON.stringify(r)}`)); }
      catch (e) { apunta(false, `${texto} → error: ${e.message}`); }
    };

    // 1) Todos los módulos que lista sw.js cargan (sin caché vieja)
    const sw = await (await fetch('/sw.js', { cache: 'reload' })).text();
    const archivos = [...sw.matchAll(/'(js\/[^']+\.js)'/g)].map(m => m[1]);
    for (const f of archivos) await fetch('/' + f, { cache: 'reload' });
    for (const f of archivos) {
      try { await import('/' + f); apunta(true, `carga ${f}`); }
      catch (e) { apunta(false, `carga ${f} → ${e.message}`); }
    }
    // Todos los .js de la carpeta deberían estar en sw.js (si no, no funcionan sin conexión)
    apunta(archivos.length >= 25, `sw.js lista ${archivos.length} módulos`);

    // 2) Nunca usar "ref" como prop de un componente (Preact lo reserva: ya rompió la app dos veces)
    for (const f of archivos) {
      const src = await (await fetch('/' + f)).text();
      const malos = [...src.matchAll(/<\$\{[A-Z]\w*\}[^>]*?\sref=\$\{/g)];
      if (malos.length) apunta(false, `${f}: componente con prop "ref" (reservada)`);
    }
    apunta(true, 'revisado el uso de "ref" en componentes');

    // 3) Cálculos clave
    const N = await import('/js/nutri.js');
    const { FOODS } = await import('/js/data/foods.js');
    const byId = Object.fromEntries(FOODS.map(f => [f.id, f]));
    await prueba('240 g de pollo cocido = 320 g en crudo', () => Math.round(N.toRaw(byId['pollo-pechuga'], 240, false, byId)) === 320 || N.toRaw(byId['pollo-pechuga'], 240, false, byId));
    await prueba('200 g de arroz cocido ≈ 257 kcal', () => Math.round(N.nutrFor(byId['arroz-integral'], N.toRaw(byId['arroz-integral'], 200, false, byId)).kcal) === 257);

    const P = await import('/js/entreno/parser.js');
    const R = await import('/js/entreno/rm.js');
    const linea = t => P.parsearEntreno('FUERZA\n' + t).secciones[0].partes[0].lineas[0];
    const marcas = [{ tipo: 'fuerza', ejercicio: 'clean', kg: 100, reps: 1 }];
    await prueba('"5x3 Clean 75%" → Clean, 5 series, 75 % de 100 = 75 kg', () => {
      const l = linea('5x3 Clean 75%'); const rm = R.rmParaLinea(l, marcas);
      return l.ejercicios[0] === 'Clean' && l.series === 5 && l.reps === 3 && Math.round(rm.kg * l.pct[0] / 100) === 75 || { l, rm };
    });
    await prueba('"10 clean con 70kg" → 70 kg', () => linea('10 clean con 70kg').kg === 70);
    await prueba('"Hang Power Clean 3x3 @70%" usa el padre (Clean) si no hay RM propio', () => R.rmParaLinea(linea('Hang Power Clean 3x3 @70%'), marcas).id === 'clean');
    await prueba('DB y DBs son ejercicios distintos', () => P.claveEjercicio('Power DB Clean') !== P.claveEjercicio('Power DBs Clean'));
    await prueba('EMOM x 18min se detecta', () => P.textoFormato(P.parsearEntreno('WOD\nEMOM x 18min\n1) 10 burpees').secciones[0].formato) === 'EMOM 18 min');

    const { alimentoPorNombre } = await import('/js/plan-pdf.js');
    await prueba('"Queso Ricotta Hacendado" se clasifica como ricotta', () => alimentoPorNombre('Queso Ricotta Hacendado') === 'ricotta');

    const { parseEtiqueta } = await import('/js/importar.js');
    await prueba('Lee una etiqueta pegada con Live Text', () => {
      const n = parseEtiqueta('Valor energético 1046 kJ / 250 kcal\nGrasas 10 g\nde las cuales saturadas 2,5 g\nHidratos de carbono 30 g\nProteínas 12 g\nSal 1,2 g');
      return n.kcal === 250 && n.sat === 2.5 && n.prot === 12 && n.salt === 1.2 || n;
    });

    const C = await import('/js/copias.js');
    await prueba('Una copia dañada NO se acepta', () => C.validarCopia({ app: 'otra' }).ok === false);
    await prueba('Una copia con partes rotas se rechaza sin fallar', () => C.validarCopia({ app: 'nutristock', foods: [], logs: 'roto' }).ok === false);
    const copiaBuena = () => ({ app: 'nutristock', version: 1, foods: [{ id: 'a', name: 'A' }], lots: [{ id: 1, foodId: 'a', g: 100 }], basicos: [], shopping: [], plans: [{ id: 'p1' }],
      logs: [{ id: 5, date: '2026-10-10', foodId: 'a', n: { kcal: 1 } }], weights: [{ date: '2026-10-10', kg: 84 }], settings: [{ key: 'planActivo', value: 'p1' }], workouts: [], marcas: [], ejercicios: [], whoop: [] });
    await prueba('Una copia buena (completa) se acepta', () => C.validarCopia(copiaBuena()).ok === true || C.validarCopia(copiaBuena()).errores);
    await prueba('Una copia INCOMPLETA (sin planes) se rechaza', () => { const d = copiaBuena(); delete d.plans; return C.validarCopia(d).ok === false; });
    await prueba('Una copia con datos repetidos o sin identificador se rechaza', () => { const d = copiaBuena(); d.logs.push({ id: 5, date: '2026-10-11', n: {} }); const e = copiaBuena(); e.weights.push({ kg: 80 }); return !C.validarCopia(d).ok && !C.validarCopia(e).ok; });
    await prueba('Una copia antigua sin Whoop se acepta y avisa (no se toca Whoop)', () => { const d = copiaBuena(); delete d.whoop; const v = C.validarCopia(d); return v.ok && v.avisos.length > 0 || v; });
    const Nb2 = await import('/js/nube.js');
    await prueba('Nube: perder los 3 pesos o 1 de 2 planes se detecta (tablas pequeñas)', () => {
      const p1 = Nb2.detectarPerdidas(['weights|a', 'weights|b', 'weights|c', 'logs|1'], ['logs|1']);
      const p2 = Nb2.detectarPerdidas(['plans|x', 'plans|y'], ['plans|y']);
      return p1.some(x => x.tabla === 'weights') && p2.some(x => x.tabla === 'plans') || { p1, p2 };
    });
    await prueba('Nube: borrar 2 comidas de 100 o cosas de la lista NO se toma como pérdida', () =>
      Nb2.detectarPerdidas([...Array(100)].map((_, i) => 'logs|' + i).concat(['shopping|1', 'shopping|2']), [...Array(98)].map((_, i) => 'logs|' + i)).length === 0);
    await prueba('Nube: lo de fábrica (básicos, ajustes) no cuenta como datos tuyos', () => Nb2.filasPropias(['basicos|sal', 'settings|prefs', 'logs|1']) === 1);
    const D = await import('/js/db.js');
    await prueba('Registros nuevos: números únicos y crecientes', () => { const a = D.nuevoId(), b = D.nuevoId(), c = D.nuevoId(); return a < b && b < c && a > 1e15 || [a, b, c]; });

    const Nb = await import('/js/nube.js');
    await prueba('Nube: la huella no depende del orden de los datos', () => Nb.huella({ a: 1, b: { c: 2, d: [1, 2] } }) === Nb.huella({ b: { d: [1, 2], c: 2 }, a: 1 }));
    await prueba('Nube: un cambio cambia la huella', () => Nb.huella({ g: 240 }) !== Nb.huella({ g: 241 }));

    const CP = await import('/js/compra-plan.js');
    const planMini = { comidas: [{ id: 'comida', bloques: [{ id: 'proteina', alimentos: [{ f: 'pollo-pechuga', g: 240 }] }] }], listas: {} };
    await prueba('Compra del plan: 240 g de pollo cocido × 7 días = 2,24 kg crudo; con 1 kg en casa faltan 1,24 kg', () => {
      const r = CP.necesidadesPlan({ plan: planMini, foods: FOODS, lots: [{ foodId: 'pollo-pechuga', g: 1000 }], dias: 7 })[0];
      return Math.round(r.necesita) === 2240 && Math.round(r.falta) === 1240 || r;
    });

    const W = await import('/js/whoop.js');
    await prueba('Whoop: un ciclo que empieza a las 23:30 UTC en España (+02:00) cuenta para el día siguiente', () => W.fechaLocal('2026-10-09T23:30:00.000Z', '+02:00') === '2026-10-10');
    await prueba('Whoop: resumen del día (recuperación, horas de sueño sin siestas, kcal)', () => {
      const r = W.resumenWhoop([
        { tipo: 'recuperacion', d: { score: { recovery_score: 71, hrv_rmssd_milli: 62, resting_heart_rate: 52 } } },
        { tipo: 'sueno', d: { nap: true, end: '2026-10-10T15:00:00Z', score: { stage_summary: { total_in_bed_time_milli: 3.6e6, total_awake_time_milli: 0 } } } },
        { tipo: 'sueno', d: { nap: false, end: '2026-10-10T06:00:00Z', score: { sleep_performance_percentage: 88, stage_summary: { total_in_bed_time_milli: 8 * 3.6e6, total_awake_time_milli: 0.5 * 3.6e6 } } } },
        { tipo: 'ciclo', d: { start: '2026-10-10T05:00:00Z', end: null, score: { strain: 14.2, kilojoule: 12552 } } },
      ]);
      return r.recuperacion === 71 && r.horas === 7.5 && Math.round(r.kcal) === 3000 && r.enCurso === true || r;
    });

    const Cr = await import('/js/cruces.js');
    await prueba('Cruces: con menos de 8 días no saca conclusiones', () => Cr.compararMitades([{ x: 1, y: 50 }, { x: 2, y: 60 }]) === null);
    await prueba('Cruces: separa días con más y menos carbos y compara la recuperación', () => {
      const fechas = Array.from({ length: 10 }, (_, i) => `2026-10-${String(i + 2).padStart(2, '0')}`);
      const comida = {}, whoop = {};
      fechas.forEach((f, i) => { comida[`2026-10-${String(i + 1).padStart(2, '0')}`] = { n: { carb: i < 5 ? 100 : 250 } }; whoop[f] = { recuperacion: i < 5 ? 50 : 75 }; });
      const pares = Cr.paresCruce({ fechas, comida, whoop, factor: Cr.FACTORES.find(f => f.id === 'carb') });
      const c = Cr.compararMitades(pares);
      return pares.length === 10 && c.umbral === 175 && c.alto.media === 75 && c.bajo.media === 50 || { pares, c };
    });
    await prueba('Cruces: la hora de la cena se escribe como hora', () => Cr.textoHora(22.5) === '22:30');

    const LC = await import('/js/lista-compra.js');
    await prueba('Lista única: lo del plan y el aviso de la despensa salen en UNA fila', () => {
      const marca = { ...byId['pollo-pechuga'], id: 'p-x', source: 'manual', name: 'Pechuga X', genericId: 'pollo-pechuga', packG: 500, envase: 'bandeja', aviso: 1, comprar: 2 };
      const l = LC.construirLista({ plan: planMini, foods: [...FOODS, marca], lots: [], dias: 7, hoy: '2026-10-10' });
      const f = l.filter(x => x.clave === 'f:pollo-pechuga');
      return f.length === 1 && f[0].motivos.length === 2 && LC.textoCantidad(f[0]).principal === '5 bandejas' || l;
    });
    await prueba('Lista: "ponerlo en la lista ya" lo añade aunque no toque por el aviso', () => {
      const m = { ...byId['muesli'], id: 'p-m', source: 'manual', genericId: 'muesli', packG: 375, envase: 'bolsa', comprar: 2 };
      const l = LC.construirLista({ plan: null, foods: [...FOODS, m], lots: [{ foodId: 'p-m', g: 375 }], forzados: { 'f:muesli': { foodId: 'p-m' } }, hoy: '2026-10-10' });
      return l.length === 1 && l[0].motivos[0] === 'tú' && LC.textoCantidad(l[0]).principal === '2 bolsas' || l;
    });
    await prueba('Lista única: el pan se pide en rebanadas', () => LC.textoCantidad({ g: 420 }, 420, byId['pan-integral']).principal === '14 rebanadas');

    const Mi = await import('/js/data/micros.js');
    await prueba('Vitaminas: todos los alimentos base tienen datos', () => FOODS.every(f => Mi.MICRO_DATA[f.id]) || FOODS.filter(f => !Mi.MICRO_DATA[f.id]).map(f => f.id));
    await prueba('Vitaminas: 320 g de pollo crudo ≈ 1,3 mg de hierro y 1069 mg de potasio', () => {
      const m = Mi.microsDe(byId['pollo-pechuga'], 320, byId);
      return Math.round(m.fe * 10) === 13 && Math.round(m.k) === 1069 || m;
    });
    await prueba('Vitaminas: un producto tuyo usa los datos de su alimento base', () => Mi.microsDe({ id: 'p-x', genericId: 'espinacas' }, 100, byId).fe === 2.7);

    const Re = await import('/js/views/receta.js');
    await prueba('Receta: 250 g de lentejas + 200 g de zanahoria en 1200 g cocinados ≈ 76 kcal/100 g', () => {
      const r = Re.calcularReceta([{ foodId: 'lentejas', g: 250 }, { foodId: 'zanahoria', g: 200 }], 1200, byId);
      return Math.round(r.n.kcal) === 76 && r.crudoG === 450 || r;
    });

    const En = await import('/js/views/entreno.js');
    await prueba('Entreno: evolución del 1RM usa el estimado (100 kg × 3 ≈ 110 kg)', () => {
      const e = En.evolucionRM([{ kg: 100, reps: 3, date: '2026-09-01' }, { kg: 112, reps: 1, date: '2026-10-01' }]);
      return e.length === 2 && Math.round(e[0].v) === 110 && e[1].v === 112 || e;
    });
    await prueba('Entreno: peso máximo por sesión de un ejercicio', () => {
      const s = En.sesionesConPeso([{ date: '2026-10-01', series: [{ kg: 80 }, { kg: 85 }] }, { date: '2026-10-08', series: [{ kg: 90 }] }]);
      return s.length === 2 && s[0].v === 85 && s[1].v === 90 || s;
    });
    await prueba('Entreno: unir ejercicios (alias)', () => En.alias([{ id: 'wall ball', uneCon: 'cal row' }, { id: 'x' }])['wall ball'] === 'cal row');

    document.getElementById('resumen').innerHTML = fallos
      ? `<span class="mal">✗ ${fallos} de ${total} comprobaciones fallan. NO publicar.</span>`
      : `<span class="ok">✓ Todo bien (${total} comprobaciones). Se puede publicar.</span>`;
    window.__comprobacion = { fallos, total };
  </script>
</body>
</html>
