<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NutriStock · comprobación antes de publicar</title>
  <style>
    body { font: 15px -apple-system, Segoe UI, sans-serif; margin: 24px; background: #111; color: #eee; }
    h1 { font-size: 20px; }
    li { margin: 3px 0; }
    .ok { color: #4ade80; } .mal { color: #f87171; font-weight: 600; }
    #resumen { font-size: 18px; margin: 12px 0; padding: 10px; border-radius: 8px; background: #222; }
  </style>
</head>
<body>
  <h1>Comprobación de NutriStock (antes de publicar)</h1>
  <p>Uso: <code>py herramientas/servidor.py</code> y abrir <code>http://127.0.0.1:5180/herramientas/comprobar.html</code>.
    Tiene que salir TODO en verde. Sirve igual para Claude y para Codex.</p>
  <div id="resumen">Comprobando…</div>
  <ul id="lista"></ul>
  <script type="module">
    const lista = document.getElementById('lista');
    let fallos = 0, total = 0;
    const apunta = (ok, texto) => {
      total++; if (!ok) fallos++;
      const li = document.createElement('li');
      li.className = ok ? 'ok' : 'mal';
      li.textContent = (ok ? '✓ ' : '✗ ') + texto;
      lista.appendChild(li);
    };
    const prueba = async (texto, fn) => {
      try { const r = await fn(); apunta(r === true, texto + (r === true ? '' : ` → ${JSON.stringify(r)}`)); }
      catch (e) { apunta(false, `${texto} → error: ${e.message}`); }
    };

    // 1) Todos los módulos que lista sw.js cargan (sin caché vieja)
    const sw = await (await fetch('/sw.js', { cache: 'reload' })).text();
    const archivos = [...sw.matchAll(/'(js\/[^']+\.js)'/g)].map(m => m[1]);
    for (const f of archivos) await fetch('/' + f, { cache: 'reload' });
    for (const f of archivos) {
      try { await import('/' + f); apunta(true, `carga ${f}`); }
      catch (e) { apunta(false, `carga ${f} → ${e.message}`); }
    }
    // Todos los .js de la carpeta deberían estar en sw.js (si no, no funcionan sin conexión)
    apunta(archivos.length >= 25, `sw.js lista ${archivos.length} módulos`);

    // 2) Nunca usar "ref" como prop de un componente (Preact lo reserva: ya rompió la app dos veces)
    for (const f of archivos) {
      const src = await (await fetch('/' + f)).text();
      const malos = [...src.matchAll(/<\$\{[A-Z]\w*\}[^>]*?\sref=\$\{/g)];
      if (malos.length) apunta(false, `${f}: componente con prop "ref" (reservada)`);
    }
    apunta(true, 'revisado el uso de "ref" en componentes');

    // 3) Cálculos clave
    const N = await import('/js/nutri.js');
    const { FOODS } = await import('/js/data/foods.js');
    const byId = Object.fromEntries(FOODS.map(f => [f.id, f]));
    await prueba('240 g de pollo cocido = 320 g en crudo', () => Math.round(N.toRaw(byId['pollo-pechuga'], 240, false, byId)) === 320 || N.toRaw(byId['pollo-pechuga'], 240, false, byId));
    await prueba('200 g de arroz cocido ≈ 257 kcal', () => Math.round(N.nutrFor(byId['arroz-integral'], N.toRaw(byId['arroz-integral'], 200, false, byId)).kcal) === 257);

    const P = await import('/js/entreno/parser.js');
    const R = await import('/js/entreno/rm.js');
    const linea = t => P.parsearEntreno('FUERZA\n' + t).secciones[0].partes[0].lineas[0];
    const marcas = [{ tipo: 'fuerza', ejercicio: 'clean', kg: 100, reps: 1 }];
    await prueba('"5x3 Clean 75%" → Clean, 5 series, 75 % de 100 = 75 kg', () => {
      const l = linea('5x3 Clean 75%'); const rm = R.rmParaLinea(l, marcas);
      return l.ejercicios[0] === 'Clean' && l.series === 5 && l.reps === 3 && Math.round(rm.kg * l.pct[0] / 100) === 75 || { l, rm };
    });
    await prueba('"10 clean con 70kg" → 70 kg', () => linea('10 clean con 70kg').kg === 70);
    await prueba('"Hang Power Clean 3x3 @70%" usa el padre (Clean) si no hay RM propio', () => R.rmParaLinea(linea('Hang Power Clean 3x3 @70%'), marcas).id === 'clean');
    await prueba('DB y DBs son ejercicios distintos', () => P.claveEjercicio('Power DB Clean') !== P.claveEjercicio('Power DBs Clean'));
    await prueba('EMOM x 18min se detecta', () => P.textoFormato(P.parsearEntreno('WOD\nEMOM x 18min\n1) 10 burpees').secciones[0].formato) === 'EMOM 18 min');

    // ---------- v3 · Fase 3: entrenos ----------
    const En3 = await import('/js/views/entreno.js');
    const m115 = [{ tipo: 'fuerza', ejercicio: 'clean', kg: 115, reps: 1 }];
    const kgs = (l, marcas, cfg, eleg) => En3.pautaLinea(l, marcas, cfg, eleg).series;
    await prueba('Clean 5x3 @45%-50%-55%-60%-62.5%: 5 series, un % por serie (con decimales)', () => {
      const l = linea('Clean 5x3 @45%-50%-55%-60%-62.5% (Rest: 90 seg)');
      return l.series === 5 && l.pct.join() === '45,50,55,60,62.5' && l.pctModo === 'serie' && l.descanso === 90 || l;
    });
    await prueba('…con RM 115 kg: teórico 51,75 / 57,5 / 63,25 / 69 / 71,875 y redondeado a 1 kg 52 / 58 / 63 / 69 / 72', () => {
      const s = kgs(linea('Clean 5x3 @45-50-55-60-62.5%'), m115, { redondeo: 1 });
      return s.map(x => x.teorico).join() === '51.75,57.5,63.25,69,71.875' && s.map(x => x.kg).join() === '52,58,63,69,72' || s;
    });
    await prueba('…redondeando a 2,5 kg (discos): 52,5 / 57,5 / 62,5 / 70 / 72,5, sin perder el teórico', () => {
      const s = kgs(linea('Clean 5x3 @45-50-55-60-62.5%'), m115, { redondeo: 2.5 });
      return s.map(x => x.kg).join() === '52.5,57.5,62.5,70,72.5' && s[4].teorico === 71.875 || s;
    });
    await prueba('Clean Deficit Deadlift 3x3 @35-40-45% del RM de Clean usa el RM de Clean', () => {
      const p = En3.pautaLinea(linea('Clean Deficit Deadlift 3x3 @35-40-45% del RM de Clean'), m115, { redondeo: 0 });
      return p.rm.id === 'clean' && p.series.map(x => x.kg).join() === '40.25,46,51.75' || p;
    });
    await prueba('"60% del RM de Front Squat" sin RM de Front Squat: no se inventa (sin kilos)', () => {
      const p = En3.pautaLinea(linea('Thruster 3x8 @60% del RM de Front Squat'), m115, {});
      return p.rm.id === 'front-squat' && p.rm.kg === null && p.series.every(x => x.kg === null) || p;
    });
    const textoCx = 'FUERZA\nComplex de Snatch\nCada 1:30 x 6 sets\n1 Power Snatch\n1 Squat Snatch\n1 Overhead Squat\n35-40-45-50-55-60%';
    const cx = P.parsearEntreno(textoCx).secciones[0];
    const lcx = cx.partes[0].lineas.find(l => l.tipo === 'complejo');
    await prueba('Complejo: 3 movimientos juntos, 6 series cada 1:30 con su % (y "Cada 1:30" NO son 30 series)', () =>
      lcx && lcx.movimientos.length === 3 && lcx.series === 6 && lcx.intervalo === 90 && lcx.pct.length === 6 && lcx.pctModo === 'serie'
      && cx.partes[0].lineas.every(l => l.series !== 30) && P.textoFormato(cx.formato).startsWith('Cada 1:30') || cx);
    await prueba('Complejo sin referencia en el texto: pide elegir el RM (no lo adivina)', () => {
      const p = En3.pautaLinea(lcx, [{ tipo: 'fuerza', ejercicio: 'power-snatch', kg: 70, reps: 1 }], {});
      return p.rm.dudosa === true && p.series.every(x => x.kg === null) && p.rm.candidatos.includes('power-snatch') || p;
    });
    await prueba('…eligiendo Power Snatch (70 kg): 24,5 / 28 / 31,5 / 35 / 38,5 / 42 kg', () => {
      const s = kgs(lcx, [{ tipo: 'fuerza', ejercicio: 'power-snatch', kg: 70, reps: 1 }], { redondeo: 0 }, 'power-snatch');
      return s.map(x => x.kg).join() === '24.5,28,31.5,35,38.5,42' || s;
    });
    await prueba('Sin RM: no se calcula; con solo un 3RM, el estimado NO se usa hasta que lo aceptas', () => {
      const l = linea('Back Squat 4x3 @75%'), mm = [{ tipo: 'fuerza', ejercicio: 'back-squat', kg: 100, reps: 3 }];
      const sin = En3.pautaLinea(l, [], {}), est = En3.pautaLinea(l, mm, {}), ok = En3.pautaLinea(l, mm, { estimados: { 'back-squat': true }, redondeo: 0 });
      return sin.rm.sinRM && sin.series.every(x => x.kg === null) && est.rm.kg === null && est.rm.estimado?.kg === 110 && ok.series[0].kg === 82.5 || { sin, est, ok };
    });
    await prueba('Training Max: si lo activas, los % van sobre el TM', () => {
      const p = En3.pautaLinea(linea('Clean 3x2 @80%'), m115, { usarTM: true, tm: { clean: 105 }, redondeo: 0 });
      return p.rm.fuente === 'tm' && p.series[0].kg === 84 || p;
    });
    await prueba('Rango "4x3 @ 100-110%": las 4 series con su horquilla de kilos', () => {
      const s = kgs(linea('Back Squat 4x3 @ 100-110%'), [{ tipo: 'fuerza', ejercicio: 'back-squat', kg: 100, reps: 1 }], { redondeo: 0 });
      return s.length === 4 && s.every(x => x.kg === 100 && x.kgHasta === 110) || s;
    });
    await prueba('Descansos: "rest 2 min" = 120 s, "descanso 1:30" = 90 s, "90\'\' rest" = 90 s', () =>
      P.leerDescanso('rest 2 min') === 120 && P.leerDescanso('descanso 1:30') === 90 && P.leerDescanso("90'' rest") === 90);
    await prueba('WOD por minutos: 0-8 trabajo, 8-10 descanso, 10-20 trabajo; "Min 0-8" no es un ejercicio', () => {
      const s = P.parsearEntreno('WOD\nMin 0-8: AMRAP\n10 Burpees\nMin 8-10: Rest\nMin 10-20: AMRAP\n20 DU').secciones[0];
      const f = s.formato, ls = s.partes[0].lineas;
      return f.tipo === 'segmentos' && f.tramos.map(x => `${x.desde}-${x.hasta}${x.descanso ? 'd' : ''}`).join() === '0-8,8-10d,10-20'
        && ls.filter(l => l.tipo === 'ejercicio').map(l => l.ejercicios[0]).join() === 'Burpees,Double Unders' || s;
    });
    await prueba('Una instrucción ("Mantener la técnica…") no es un ejercicio', () => linea('Mantener la técnica por encima de la velocidad en todo momento').tipo === 'instruccion');
    await prueba('Lectura congelada: con resultados de antes se lee con el lector antiguo; sin resultados, con el nuevo', () => {
      const texto = 'FUERZA\nCada 1:30 x 6 sets\n1 Power Snatch';
      const viejo = En3.leer({ id: 'w1', texto, resultados: { 0: { notas: 'x' } } });
      const nuevo = En3.leer({ id: 'w2', texto, resultados: {} });
      const cong = En3.leer({ id: 'w3', texto, resultados: { 0: { notas: 'x' } }, estructura: { secciones: [{ titulo: 'Congelada', partes: [] }] } });
      return viejo.lector === undefined && nuevo.lector === 2 && cong.secciones[0].titulo === 'Congelada' || { viejo, nuevo };
    });

    // ---------- v3 · Fase 4: relojes, descanso y tiempos ----------
    const Ti = await import('/js/tiempo.js');
    const De = await import('/js/descanso.js');
    const Re4 = await import('/js/views/reloj.js');
    const So = await import('/js/sonido.js');
    await prueba('Tiempo: 15 min y 40 s se guarda como 940 s y se ve "15:40"', () => Ti.aSegundos(15, 40) === 940 && Ti.fmtTiempo(940) === '15:40');
    await prueba('Tiempo: más de 59 minutos (75 min 5 s) = 1:15:05; los segundos de 60 o más no valen', () =>
      Ti.aSegundos(75, 5) === 4505 && Ti.fmtTiempo(4505) === '1:15:05' && Ti.aSegundos(15, 60) === null);
    await prueba('Tiempo antiguo "1540" (teclado numérico) se lee como 15:40 pero marcado como dudoso', () => {
      const t = Ti.leerTiempo('1540');
      return t.s === 940 && t.dudoso === true && Ti.textoTiempoResultado({ tiempo: '1540' }) === '15:40 (?)' && Ti.textoTiempoResultado({ tiempoS: 940, tiempo: '15:40' }) === '15:40';
    });
    await prueba('Tiempo: "15:40", "1:05:20", "15\'40" se entienden', () => Ti.leerTiempo('15:40').s === 940 && Ti.leerTiempo('1:05:20').s === 3920 && Ti.leerTiempo("15'40").s === 940);
    await prueba('Descanso de 90 s: con pausa no corre, +15 s alarga, y termina en 0', () => {
      let d = De.crearDescanso(90, 0);
      const a = De.restante(d, 30000);
      d = De.pausar(d, 30000); const b = De.restante(d, 50000);
      d = De.seguir(d, 50000); d = De.sumar(d, 15); const c = De.restante(d, 60000);
      return a === 60 && b === 60 && c === 65 && De.restante(d, 200000) === 0 || { a, b, c };
    });
    await prueba('Reloj personalizado: 8\' trabajo + 2\' descanso + 10\' trabajo = 20 min con 3 tramos (y 10 s de preparación)', () => {
      const cfg = { tipo: 'personalizado', bloques: [{ tipo: 'trabajo', nombre: 'A', dur: 480 }, { tipo: 'descanso', nombre: 'Descanso', dur: 120 }, { tipo: 'trabajo', nombre: 'B', dur: 600 }], repetir: 1 };
      const t = Re4.tramos(cfg);
      return t.length === 4 && t.map(x => x.tipo).join() === 'prep,trabajo,descanso,trabajo' && Re4.duracionTotal(cfg) === 1200 && t[3].bloque === 1 || t;
    });
    await prueba('Reloj por minutos del texto (0-8 / 8-10 descanso / 10-20) se convierte en sus tramos', () => {
      const f = P.parsearEntreno('WOD\nMin 0-8: AMRAP\n10 Burpees\nMin 8-10: Rest\nMin 10-20: AMRAP\n20 DU').secciones[0].formato;
      const t = Re4.tramos(f);
      return t.slice(1).map(x => `${x.tipo}:${x.dur}`).join() === 'trabajo:480,descanso:120,trabajo:600' || t;
    });
    await prueba('"Cada 1:30 x 6" es un intervalo fijo de 6 × 90 s (no un descanso)', () => {
      const t = Re4.tramos({ tipo: 'emom', intervalo: 90, total: 540 });
      return t.length === 7 && t.slice(1).every(x => x.dur === 90) || t;
    });
    await prueba('Sonido con música: "bajar" pide a Safari una sesión transitoria; "mezclar", ambiente', () =>
      So.tipoSesion({ musica: 'bajar' }) === 'transient' && So.tipoSesion({ musica: 'mezclar' }) === 'ambient' && So.tipoSesion({ musica: 'pausar' }) === 'transient-solo');

    // ---------- v3 · Fase 5: suplementos y etiquetas ----------
    const Su = await import('/js/suplementos.js');
    const omegaEN = 'Supplement Facts\nServing Size 2 Softgels\nServings Per Container 60\nAmount Per Serving %DV\nCalories 20\nTotal Fat 2 g 3%\nFish Oil Concentrate 2000 mg\nTotal Omega-3 Fatty Acids 1200 mg\nEPA (Eicosapentaenoic Acid) 720 mg\nDHA (Docosahexaenoic Acid) 480 mg';
    await prueba('Omega 3 en inglés: porción 2 cápsulas, EPA 720 y DHA 480 por separado, total 1200, y el aceite (2000 mg) NO cuenta', () => {
      const r = Su.parseEtiquetaSupl(omegaEN);
      return r.porcion === 2 && r.unidad === 'capsula' && r.valores.epa === 720 && r.valores.dha === 480 && r.valores.o3 === 1200
        && r.dudas.some(d => /aceite de pescado/.test(d)) || r;
    });
    await prueba('Suplemento con calorías: el omega 3 tiene 20 kcal y 2 g de grasa (no se asume 0)', () => {
      const r = Su.parseEtiquetaSupl(omegaEN);
      return r.valores.kcal === 20 && r.valores.fat === 2 || r;
    });
    await prueba('Electrolitos en inglés: "1 stick" = 1 sobre; sodio 1000, potasio 200, magnesio 60 mg; 5 kcal y 2 g de hidratos', () => {
      const r = Su.parseEtiquetaSupl('Nutrition Facts\nServing size 1 stick (5.5 g)\nCalories 5\nTotal Carbohydrate 2g\nSodium 1000mg 43%\nPotassium 200mg 4%\nMagnesium 60mg 14%');
      return r.porcion === 1 && r.unidad === 'sobre' && r.valores.na === 1000 && r.valores.k === 200 && r.valores.mg === 60 && r.valores.kcal === 5 && r.valores.carb === 2 || r;
    });
    await prueba('Magnesio en español: coge el magnesio elemental (300 mg), no el bisglicinato; vitamina D 1000 UI = 25 µg (y lo avisa)', () => {
      const r = Su.parseEtiquetaSupl('Tamaño de la porción: 2 comprimidos\nBisglicinato de magnesio 1500 mg\nde los cuales magnesio elemental 300 mg\nVitamina D3 (colecalciferol) 1000 UI');
      return r.porcion === 2 && r.unidad === 'comprimido' && r.valores.mg === 300 && r.valores.vd === 25 && r.dudas.some(d => /UI/.test(d)) || r;
    });
    await prueba('Gominolas: 15 kcal (de los kJ/kcal), hidratos 3,5 g y azúcares 2,8 g', () => {
      const r = Su.parseEtiquetaSupl('Por dosis diaria (2 gominolas)\nValor energético 63 kJ / 15 kcal\nHidratos de carbono 3,5 g\nde los cuales azúcares 2,8 g\nVitamina C 80 mg');
      return r.porcion === 2 && r.unidad === 'gominola' && r.valores.kcal === 15 && r.valores.carb === 3.5 && r.valores.sug === 2.8 || r;
    });
    await prueba('Sin calorías en la etiqueta: no se inventan (se avisa)', () => {
      const r = Su.parseEtiquetaSupl('Per serving (1 scoop)\nProtein 20 g\nTotal fat 1 g');
      return r.valores.kcal == null && r.dudas.some(d => /no las calculo/.test(d)) || r;
    });
    await prueba('Lo que aporta un suplemento con EPA y DHA no los cuenta dos veces en el resumen', () => {
      const t = Su.textoAporte(Su.aporteSupl({ porcion: 2, valores: { o3: 1200, epa: 720, dha: 480 } }, 2));
      return t === 'omega 3 total 1200 mg' || t;
    });

    if (['127.0.0.1', 'localhost'].includes(location.hostname)) {
      const { db, getSetting, setSetting } = await import('/js/db.js');
      const listaAntes = await getSetting('suplementos', null);
      const F = '2000-03-01';
      try {
        await setSetting('suplementos', [
          { id: 'zz-gomi', nombre: 'Gominolas (prueba)', unidad: 'gominola', porcion: 2, habitual: 2, valores: { kcal: 15, carb: 3.5, sug: 2.8, vc: 80 } },
          { id: 'zz-mag', nombre: 'Magnesio (prueba)', unidad: 'comprimido', porcion: 2, habitual: 2, valores: { mg: 300 } },
        ]);
        await Su.marcarSupl(F, 'zz-gomi', 4);
        await Su.marcarSupl(F, 'zz-mag', 2);
        const ls = await db.logs.where('date').equals(F).toArray();
        await prueba('Marcar un suplemento con calorías lo suma al día (4 gominolas = 30 kcal); uno sin calorías no crea nada', () =>
          ls.length === 1 && ls[0].suplId === 'zz-gomi' && ls[0].mealId === 'supl' && ls[0].n.kcal === 30 && ls[0].n.carb === 7 || ls);
        await Su.marcarSupl(F, 'zz-gomi', 0);
        await prueba('Desmarcarlo quita esas calorías del día', async () => (await db.logs.where('date').equals(F).count()) === 0);
      } finally {
        await db.logs.where('date').equals(F).delete();
        await db.settings.delete('supl:' + F);
        if (listaAntes) await setSetting('suplementos', listaAntes); else await db.settings.delete('suplementos');
      }
    }

    // ---------- v3 · Fase 6: medidas, peso e informe ----------
    const Md = await import('/js/medidas.js');
    const filasCintura = [
      { id: 1, fecha: '2026-10-01', tipo: 'cintura', valor: 88, sesion: 's1', representativa: true, ts: 1 },
      { id: 2, fecha: '2026-10-08', tipo: 'cintura', valor: 87.5, sesion: 's2', representativa: false, ts: 2 },
      { id: 3, fecha: '2026-10-08', tipo: 'cintura', valor: 85.5, sesion: 's2', representativa: true, ts: 3 },
      { id: 4, fecha: '2026-10-15', tipo: 'cintura', valor: 86, sesion: 's3', representativa: false, ts: 4 },
      { id: 5, fecha: '2026-10-15', tipo: 'cintura', valor: 85, sesion: 's3', representativa: false, ts: 5 },
    ];
    await prueba('Medidas: dos tomas el mismo día se guardan las dos; cuenta la que marcaste (85,5), sin hacer la media', () => {
      const s = Md.sesionesDe(filasCintura, 'cintura').find(x => x.sesion === 's2');
      return s.tomas.length === 2 && s.rep.valor === 85.5 || s;
    });
    await prueba('Medidas: una sesión sin la buena marcada no inventa un valor (sale sin punto)', () => {
      const serie = Md.serieDe(filasCintura, 'cintura');
      return serie.length === 3 && serie[2].valor === null && serie[2].tomas.join() === '86,85' && serie[1].valor === 85.5 || serie;
    });
    await prueba('Medidas: cambio frente a la anterior (85,5 − 88 = −2,5 cm)', () => {
      const c = Md.cambiosMedida(Md.serieDe(filasCintura, 'cintura'));
      return c.ultima.valor === 85.5 && c.vsAnterior === -2.5 || c;
    });
    const pesosEj = ['2026-09-21', '2026-09-23', '2026-09-25', '2026-09-28', '2026-09-30', '2026-10-02', '2026-10-05', '2026-10-07', '2026-10-09', '2026-10-12', '2026-10-14', '2026-10-16', '2026-10-18']
      .map((date, i) => ({ date, kg: 84 - i * 0.1 }));
    await prueba('Peso: media de cada semana (lunes a domingo) con sus pesajes', () => {
      const s = Md.mediasSemanales(pesosEj);
      return s.length === 4 && s[0].semana === '2026-09-21' && Math.abs(s[0].media - 83.9) < 0.001 && s[0].n === 3 || s;
    });
    await prueba('Peso: tendencia ≈ −0,3 kg/semana frente a un objetivo de −0,25 (en línea, diferencia < 0,1)', () => {
      const r = Md.resumenPeso(pesosEj, '2026-10-18', -0.25);
      return r.tendencia < -0.25 && r.tendencia > -0.35 && Math.abs(r.frenteObjetivo) < 0.1 && r.media7 != null && r.cambioSemana < 0 || r;
    });
    await prueba('Peso: con pocos datos no se inventa tendencia ni cambios', () => {

        await prueba('Restaurar una copia con Whoop dañado se rechaza ANTES de tocar nada: datos, copia previa y nube intactos', async () => {
          const mala = JSON.parse(JSON.stringify(antes)); mala.whoop = [{ id: 'dato-incompleto' }];
          const nInternas = (await C.listarInternas()).length, nWhoop = await db.whoop.count();
          const e = await falla(() => C.restaurarCopia(mala, { confirmarBorrado: true }));
          return !!e && (await db.whoop.count()) === nWhoop && !(await db.whoop.get('dato-incompleto')) && !!(await db.porciones.get('zz-p1-por'))
            && (await C.listarInternas()).length === nInternas && permiso() === null || { e, permiso: permiso() };
        });
        await prueba('Si la restauración falla al guardar, no cambia nada y se retira el permiso de borrar en la nube', async () => {
          const rota = JSON.parse(JSON.stringify(antes)); rota.foods = [...rota.foods, { id: { roto: 1 }, name: 'Clave imposible' }];
          const okVal = C.validarCopia(rota).ok;
          const e = await falla(() => C.restaurarCopia(rota, { confirmarBorrado: true }));
          return okVal && !!e && permiso() === null && !!(await db.porciones.get('zz-p1-por')) && (await db.foods.count()) === antes.foods.length || { okVal, e, permiso: permiso() };
        });
        await C.restaurarCopia(v35, { confirmarBorrado: true });
        await prueba('Restaurar una copia v35 confirmando: sin porciones ni medidas de V3, y todo igual que en la copia', async () => {
          const ahora = await exportAll();
          const iguales = ['foods', 'lots', 'logs', 'weights', 'plans', 'workouts'].every(t => ahora[t].length === v35[t].length);
          return (await db.porciones.count()) === 0 && (await db.medidas.count()) === 0 && iguales && (await db.weights.get('1999-01-01'))?.kg === 77.7
            || { porciones: await db.porciones.count(), medidas: await db.medidas.count(), iguales };
        });
        await prueba('Antes de restaurar se guarda una copia automática «antes de restaurar» (para volver atrás)', async () => {
          const ult = (await C.listarInternas())[0];
          return ult?.motivo === 'antes de restaurar' && ult.datos.porciones?.some(p => p.id === 'zz-p1-por') || ult?.motivo;
        });
        await prueba('Tras restaurar bien, la nube queda avisada de que los borrados son a propósito', () => !!permiso());
        localStorage.removeItem('nube-permitir-borrado');
      } finally {
        await importAll(antes); // la base de pruebas vuelve a como estaba
      }

      // ---- AUD-V3-009 con el proceso REAL de restaurar (base del navegador de pruebas; se deja como estaba) ----
      const antesW = await exportAll();
      const huella = async () => JSON.stringify(await exportAll(), (k, v) => (k === 'exportedAt' ? undefined : v));
      try {
        await db.whoop.bulkPut(filasBuenas); // datos de Whoop válidos ya guardados
        const conWhoopBueno = await exportAll();
        const estado0 = await huella();
        const nInternas0 = (await C.listarInternas()).length;
        localStorage.removeItem('nube-permitir-borrado');
        const mala = JSON.parse(JSON.stringify(conWhoopBueno));
        mala.whoop = mala.whoop.map(f => (f.id === IDS.ciclo ? { ...f, d: {} } : f));
        mala.weights = [...mala.weights.filter(w => w.date !== '1999-02-02'), { date: '1999-02-02', kg: 70 }]; // cambio que NO debe aplicarse
        await prueba('Restaurar una copia con d: {} en Whoop: se rechaza sin cambiar NADA (ni Whoop, ni otros datos, ni copia previa, ni nube)', async () => {
          const e = await falla(() => C.restaurarCopia(mala, { confirmarBorrado: true }));
          return !!e && String(e).includes('Whoop') && (await huella()) === estado0 && (await C.listarInternas()).length === nInternas0
            && localStorage.getItem('nube-permitir-borrado') === null && JSON.stringify((await db.whoop.get(IDS.ciclo)).d) !== '{}' || { e };
        });
        const cruzada = JSON.parse(JSON.stringify(conWhoopBueno));
        cruzada.whoop = cruzada.whoop.map(f => (f.id === IDS.recuperacion ? { ...f, d: { ...f.d, cycle_id: 11111 } } : f));
        await prueba('Restaurar una copia con un Whoop de identificador cruzado: se rechaza sin cambiar nada', async () => {
          const e = await falla(() => C.restaurarCopia(cruzada, { confirmarBorrado: true }));
          return !!e && (await huella()) === estado0 && (await C.listarInternas()).length === nInternas0 && localStorage.getItem('nube-permitir-borrado') === null || { e };
        });
        // Copia buena: se exporta y se restaura sobre datos distintos; vuelve exactamente lo de la copia
        await db.whoop.delete(IDS.entreno);
        await db.whoop.put({ ...fila(IDS.ciclo), id: 'ciclo:55555', d: { ...fila(IDS.ciclo).d, id: 55555 } });
        await C.restaurarCopia(conWhoopBueno, { confirmarBorrado: true });
        await prueba('Exportar y restaurar una copia buena con los 4 tipos de Whoop: vuelve exactamente igual (la validación no la bloquea)', async () => {
          const ahora = await db.whoop.toArray();
          const ordena = x => JSON.stringify([...x].sort((p, q) => p.id.localeCompare(q.id)));
          return ordena(ahora) === ordena(conWhoopBueno.whoop) && !(await db.whoop.get('ciclo:55555')) && !!(await db.whoop.get(IDS.entreno))
            && !!localStorage.getItem('nube-permitir-borrado') || { n: ahora.length };
        });
      } finally {
        await importAll(antesW);
        localStorage.removeItem('nube-permitir-borrado');
      }
    }

    document.getElementById('resumen').innerHTML = fallos
      ? `<span class="mal">✗ ${fallos} de ${total} comprobaciones fallan. NO publicar.</span>`
      : `<span class="ok">✓ Todo bien (${total} comprobaciones). Se puede publicar.</span>`;
    window.__comprobacion = { fallos, total };
  </script>
